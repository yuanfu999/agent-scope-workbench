spring:
  application:
    name: agentscope-workbench

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.agent: DEBUG
    io.agentscope: INFO