#   3) 启动时自动校验 Docker 可达 + 镜像含 sh/ls/cat（check-on-start，FR-3.4）
#   4) 对话触发文件工具：容器内工作区来自投影根（AGENTS.md/skills/subagents/knowledge，FR-3.5）
#   5) 沙箱执行后生成快照目录 .agentscope/snapshots（snapshot-type: LOCAL，FR-3.2）
