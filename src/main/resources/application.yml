workbench:
  api-key: ${WORKBENCH_API_KEY:_default}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:}
  main-agent: rnd-assistant-pro
  active-profile: ${SPRING_PROFILES_ACTIVE:dev}
  store:
    # 状态存储：json-file（dev 本地文件）/ redis（prod 分布式，FR-10.1）；未知类型启动报错
    type: ${STORE_TYPE:json-file}
    redis-url: ${REDIS_URL:}          # type=redis 必填，如 redis://localhost:6379（FR-10.2）
    key-prefix: ${STORE_KEY_PREFIX:agentscope:workbench}  # 分布式键前缀（租户隔离键基址，FR-10.4）
  observability:
    # M5 可观测性（FR-10.5）：默认关闭，dev 零开销；开启后 Agent 构建挂载 OtelTracingMiddleware
    enabled: ${OBSERVABILITY_ENABLED:false}
    otlp-endpoint: ${OTLP_ENDPOINT:http://localhost:4317}
    service-name: ${OTLP_SERVICE_NAME:agentscope-workbench}
  agents:
    - name: rnd-assistant-pro
      label: DeepSeek V4 Pro
      model: ${LLM_MODEL_PRO:deepseek:deepseek-v4-pro}
      sys-prompt: |
        你是一个研发助手，擅长代码审查、知识问答和自动化任务执行。
        你可以委派子 Agent 处理独立任务，支持 Plan Mode 拆分复杂工作。
      workspace: .agentscope/workspace
      steps: 30
      temperature: 0.7
      top-p: 0.95
      memory:
        enabled: true
        flush-trigger: THROTTLED(10m)
        model: ${MEMORY_MODEL:}
        # 定制位（可选，留空/负值使用框架默认）：
        # flush-prompt: ""             # 记忆 Flush 提示词（FR-5.3）
        # consolidation-prompt: ""     # 记忆整合提示词（FR-5.3）
        # consolidation-max-tokens: -1  # 整合最大 token 数，默认 4000（FR-5.3）
        # consolidation-min-gap: ""    # 整合最小间隔，如 24h / PT24H（FR-5.3）
        daily-file-retention-days: 90   # 日流水账保留天数，默认 90（FR-5.3）
        session-retention-days: 180     # 会话记录保留天数，默认 180（FR-5.3）
        disable-tools: false            # true 时移除记忆/会话查询工具（FR-5.6）
        disable-hooks: false            # true 时关闭后台记忆维护（FR-5.6）
      compaction:
        enabled: true
        trigger-messages: 40
        keep-messages: 10
        trigger-tokens: -1              # token 触发阈值，>0 启用溢出兜底（FR-6.2）
        keep-tokens: -1                 # 压缩后保留 token 数，默认自动计算（FR-6.2）
        # summary-prompt: ""           # 压缩摘要提示词，留空用内置（FR-6.1）
        # model: ${COMPACTION_MODEL:}  # 压缩辅助模型，留空跟随主模型（FR-1.6）
      plan-mode:
        enabled: true
        allow-shell: false
        plan-directory: plans
      task-list:
        enabled: true
      filesystem:
        mode: ${FS_MODE:LOCAL}
        isolation-scope: USER
        anonymous-user-id: _default
      sandbox:
        image: ubuntu:24.04
        memory-mb: 512
        cpu-count: 2
        # M4 沙箱扩展（FR-3.1~FR-3.5）：
        network: ""                    # Docker 网络，空则默认（FR-3.1）
        snapshot-type: LOCAL           # 快照策略：NONE / LOCAL / REMOTE（FR-3.2，REMOTE 由 M5 注入）
        snapshot-base-path: .agentscope/snapshots  # LOCAL 快照根目录（FR-3.2）
        guard-enabled: false           # 并发守卫配置位，Redis 守卫由 M5 DistributedStore 注入（FR-3.3）
        check-on-start: true           # 启动校验 Docker 可达 + 镜像 POSIX 工具链，false 跳过（FR-3.4）
        workspace-projection-enabled: true
        # workspace-root: /workspace    # 容器内工作区路径（FR-3.1）
        # exposed-ports: [8080]         # 容器暴露端口（FR-3.1）
        # environment: {}               # 容器环境变量（FR-3.1）
        # additional-run-args: []       # docker run 附加参数（FR-3.1）
        # projection-roots: [AGENTS.md, skills, subagents, knowledge]  # 工作区投影根（FR-3.5）
      skills:
        repositories:
          - classpath
          - git
        git-url: ${SKILLS_GIT_URL:}
        # skill-manage-enabled: false  # 技能自学闭环开关（FR-4.7）
      subagents:
        - reviewer
        - researcher
        - note-taker
    - name: rnd-assistant-flash
      label: DeepSeek V4 Flash
      model: ${LLM_MODEL_FLASH:deepseek:deepseek-v4-flash}
      sys-prompt: |
        你是一个研发助手，擅长代码审查、知识问答和自动化任务执行。
        你可以委派子 Agent 处理独立任务，支持 Plan Mode 拆分复杂工作。
